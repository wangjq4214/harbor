[package]
name = "harbor"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = [".", "crates/*"]

[workspace.dependencies]
# ── workspace crates ──────────────────────────────────────────────────────────
harbor-config = { path = "crates/harbor-config" }
harbor-parser = { path = "crates/harbor-parser" }
harbor-pty = { path = "crates/harbor-pty" }
harbor-render = { path = "crates/harbor-render" }
harbor-terminal = { path = "crates/harbor-terminal" }
harbor-types = { path = "crates/harbor-types" }
harbor-ui = { path = "crates/harbor-ui" }
harbor-widget = { path = "crates/harbor-widget" }
harbor-text = { path = "crates/harbor-text" }

# ── shared external deps (used by 2+ crates) ─────────────────────────────────
anyhow = "1.0"
arboard = "3.6"
fontdb = "0.23.0"
fontdue = "0.9"
hashbrown = "0.17"
tracing = "0.1"
unicode-width = "0.2"
windows = {
  version = "0.62",
  features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
  ]
}

# ── single-crate deps (centralized version management) ────────────────────────
bitvec = "1.0"
bytemuck = { version = "1.21", features = ["derive"] }
dhat = "0.3.3"
dirs = "6.0"
parking_lot = "0.12"
pollster = "1.0"
slotmap = "1"
thiserror = "2.0"
tracing-appender = "0.2"
tracing-subscriber = {
  version = "0.3",
  features = ["env-filter", "fmt", "json"]
}
wgpu = "30.0"
winit = { version = "0.30", features = ["rwh_06"] }

[dependencies]
# workspace crates
harbor-config = { workspace = true }
harbor-parser = { workspace = true }
harbor-pty = { workspace = true }
harbor-terminal = { workspace = true }
harbor-types = { workspace = true }
harbor-widget = { workspace = true }
harbor-text = { workspace = true }

# external
anyhow = { workspace = true }
arboard = { workspace = true }
bytemuck = { workspace = true }
dhat = { workspace = true, optional = true }
dirs = { workspace = true }
hashbrown = { workspace = true }
pollster = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-width = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }

[target."cfg(windows)".dependencies]
windows = { workspace = true }

[features]
default = []
backend-dx12 = ["harbor-terminal/backend-dx12"]
backend-vulkan = ["harbor-terminal/backend-vulkan"]
dhat-heap = ["dep:dhat"]

[profile.release]
opt-level = 3
strip = true
lto = true
panic = "abort"
codegen-units = 1

# Preserves symbols and line tables for useful dhat allocation backtraces.
[profile.dhat]
inherits = "release"
debug = 1
strip = "none"
