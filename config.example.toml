# Copy to ~/.harbor/config.toml. Settings are read once at startup.

[font]
family = "Cascadia Mono"
size = 24.0

[shell]
program = "pwsh.exe"
args = ["-NoLogo"]

[colors]
foreground = "#FFFFFF"
background = "#5C331440"
cursor = "#FFFFFF"
selection = "#4D80E666"

[colors.normal]
black = "#000000"
red = "#CD3131"
green = "#0DBC79"
yellow = "#E5E510"
blue = "#2472C8"
magenta = "#BC3FBC"
cyan = "#11A8CD"
white = "#E5E5E5"

[colors.bright]
black = "#666666"
red = "#F14C4C"
green = "#23D18B"
yellow = "#F5F543"
blue = "#3B8EEA"
magenta = "#D670D6"
cyan = "#29B8DB"
white = "#FFFFFF"
