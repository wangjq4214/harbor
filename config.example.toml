# Copy to ~/.harbor/config.toml. Watched by default; Ctrl+Shift+R reloads manually.
# History, colors, bindings and terminal-only fonts apply live. Shell/env/directory affect new tabs only.
# A rejected reload retains the last accepted configuration. Saves/replacements are coalesced; widget HMR is unrelated.

[font]
family = "Cascadia Mono"
size = 24.0

# Per-session primary scrollback, including primary saved behind alternate.
# Physical rows: 0..16000, default 4000. UTF-8 source bytes: 0..16777216, default 4 MiB.
# Zero is a zero allowance, never unlimited. Oldest whole rows are evicted first.
# Live/alternate text is excluded; these bytes do NOT measure process/GPU memory.
# Accepted live shrink is immediate and irreversible; growth cannot recover evicted text.
[history]
max_rows = 4000
max_bytes = 4194304

[shell]
program = "pwsh.exe"
args = ["-NoLogo"]
# Optional; relative paths are anchored at config.toml's directory, not terminal cwd.
# Must exist. Omit to inherit Harbor's directory; unavailable later means failed spawn.
# directory = 'projects'

# Child-only literal overrides; Windows keys are case-insensitive (duplicates reject).
# Empty is not deletion. Remove an override to restore inheritance in new sessions.
# TERM is protected: only xterm-256color is accepted, regardless of key casing.
# [shell.environment]
# HARBOR_EXAMPLE = '$VAR %VAR% $(literal text)'
# HARBOR_EMPTY = ""

# OSC 52 system clipboard writes: allow (default), deny, or confirm.
# Foreground active live tab only; confirm approves exactly one request.
# Fixed 4 MiB UTF-8 limit; clipboard reads are always denied. Restart to apply.
[clipboard]
osc52_write = "allow"

# Each command table's bindings replace its defaults. Modifiers in one record are
# simultaneous. Omit a command table to retain its defaults; use `bindings = []`
# to unbind it. Multiple records bind multiple chords. Any invalid command, field,
# modifier, key, duplicate, or conflict restores all defaults at startup and
# rejects the entire candidate during manual or automatic reload.
[keybindings.app.reload-configuration]
bindings = [{ modifiers = ["ctrl", "shift"], key = "r" }]
[keybindings.app.new-tab]
bindings = [{ modifiers = ["ctrl"], key = "t" }]
[keybindings.app.close-active-tab]
bindings = [{ modifiers = ["ctrl"], key = "w" }]
[keybindings.app.next-tab]
bindings = [{ modifiers = ["ctrl"], key = "tab" }]
[keybindings.app.previous-tab]
bindings = [{ modifiers = ["ctrl", "shift"], key = "tab" }]
[keybindings.app.select-tab-1]
bindings = [{ modifiers = ["ctrl"], key = "1" }]
[keybindings.app.select-tab-2]
bindings = [{ modifiers = ["ctrl"], key = "2" }]
[keybindings.app.select-tab-3]
bindings = [{ modifiers = ["ctrl"], key = "3" }]
[keybindings.app.select-tab-4]
bindings = [{ modifiers = ["ctrl"], key = "4" }]
[keybindings.app.select-tab-5]
bindings = [{ modifiers = ["ctrl"], key = "5" }]
[keybindings.app.select-tab-6]
bindings = [{ modifiers = ["ctrl"], key = "6" }]
[keybindings.app.select-tab-7]
bindings = [{ modifiers = ["ctrl"], key = "7" }]
[keybindings.app.select-tab-8]
bindings = [{ modifiers = ["ctrl"], key = "8" }]
[keybindings.app.select-tab-9]
bindings = [{ modifiers = ["ctrl"], key = "9" }]
[keybindings.terminal.copy]
bindings = [{ modifiers = ["ctrl", "shift"], key = "c" }]
[keybindings.terminal.copy-or-interrupt]
bindings = [{ modifiers = ["ctrl"], key = "c" }]
[keybindings.terminal.paste]
bindings = [
  { modifiers = ["ctrl"], key = "v" },
  { modifiers = ["shift"], key = "insert" },
]
[keybindings.terminal.page-up]
bindings = [{ modifiers = [], key = "pageup" }]
[keybindings.terminal.page-down]
bindings = [{ modifiers = [], key = "pagedown" }]
[keybindings.terminal.scroll-to-top]
bindings = [{ modifiers = [], key = "home" }]
[keybindings.terminal.scroll-to-bottom]
bindings = [{ modifiers = [], key = "end" }]
# Built-in default terminal theme: Catppuccin Mocha.
# Terminal colors do not configure application day/night mode or Acrylic tint.
# Default background opacity is 85%; cursor/selection transparency is unchanged.
[colors]
foreground = "#CDD6F4"
background = "#1E1E2E"
# 0 = transparent, 1 = opaque. Applies live to the terminal background only.
# When set, overrides background's hex alpha. If omitted, an explicit background
# keeps its hex alpha (six digits = opaque); no background setting uses 0.85.
# Without a compositor backdrop, the existing opaque fallback still applies.
background_opacity = 0.85
cursor = "#F5E0DCCC"
selection = "#F5E0DC66"

[colors.normal]
black = "#45475A"
red = "#F38BA8"
green = "#A6E3A1"
yellow = "#F9E2AF"
blue = "#89B4FA"
magenta = "#F5C2E7"
cyan = "#94E2D5"
white = "#BAC2DE"

[colors.bright]
black = "#585B70"
red = "#F38BA8"
green = "#A6E3A1"
yellow = "#F9E2AF"
blue = "#89B4FA"
magenta = "#F5C2E7"
cyan = "#94E2D5"
white = "#A6ADC8"
