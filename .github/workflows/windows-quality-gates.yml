name: Windows quality gates

on:
  pull_request:
    branches:
      - main

  workflow_call:
    inputs:
      release-tag:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Validate package version and optional release tag
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: ./scripts/packaging/package_windows.ps1 -ValidateVersionOnly -ReleaseTag $env:RELEASE_TAG

      - name: Restore pinned ConPTY runtime
        run: ./scripts/setup/fetch_conpty.ps1

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run default workspace tests
        run: cargo test --locked --workspace

      - name: Test renderer-free terminal core
        run: cargo test --locked -p harbor-terminal --no-default-features

      - name: Run required offscreen GPU tests
        env:
          HARBOR_TEST_GPU: dx12-warp
        run: cargo test --locked --workspace gpu:: -- --ignored --test-threads=1

      - name: Run real ConPTY integration tests
        env:
          HARBOR_TEST_GPU: dx12-warp
        run: cargo test --locked --workspace pty:: -- --ignored --test-threads=1

      - name: Set up Python for documentation tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test documentation and helper scripts
        run: python -B -m unittest discover -s scripts/tests -v

      - name: Test Windows process sampler
        run: pwsh -NoProfile -File scripts/tests/test_sample_process.ps1

      - name: Check documentation
        run: python scripts/docs/check_docs.py

      - name: Check public-guide Rust examples
        run: python scripts/docs/check_examples.py --include-readmes

      - name: Build public API reference without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps -p harbor-widget --features harbor-widget/winit -p harbor-terminal

      - name: Install .NET for pinned WiX
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and validate both release formats
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: ./scripts/packaging/package_windows.ps1 -ReleaseTag $env:RELEASE_TAG -OutputDirectory ./target/dist

      - name: Exercise packaging rejection boundaries
        run: |
          $version = (Get-Item ./target/x86_64-pc-windows-msvc/release/harbor.exe).VersionInfo.ProductVersion
          ./scripts/tests/test_package_windows.ps1 -ReleaseDirectory ./target/x86_64-pc-windows-msvc/release -MsiPath "./target/dist/harbor-$version-windows-x64.msi"

      - name: Preserve checked package outputs
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          path: |
            target/dist/harbor-*-windows-x64.msi
            target/dist/harbor-*-windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 7
